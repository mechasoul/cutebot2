rootLogger.level = DEBUG
rootLogger.appenderRef.0.ref = CONSOLE
rootLogger.appenderRef.0.level = INFO
rootLogger.appenderRef.1.ref = EVERYTHING_LOG
rootLogger.appenderRef.1.level = DEBUG
rootLogger.appenderRef.2.ref = INFO_LOG
rootLogger.appenderRef.2.level = INFO
rootLogger.appenderRef.3.ref = WARN_LOG
rootLogger.appenderRef.3.level = WARN
rootLogger.appenderRef.4.ref = ERROR_LOG
rootLogger.appenderRef.4.level = ERROR